<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il mio primo sito - Filippo</title>
  <style>
    /* RESET E STILE DI BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* SFONDO CON SFUMATURA MODERNA */
      background: linear-gradient(135deg, #e0f2fe 0%, #e0e7ff 100%);
      min-height: 100vh;
      color: #1e293b;
      padding: 40px 15px;
      line-height: 1.6;
    }

    /* INTESTAZIONE */
    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      color: #1e40af; /* BLU SCURO INTENSO */
      font-size: 2.4rem;
      font-weight: 800;
      margin-bottom: 6px;
      text-shadow: 0 2px 4px rgba(30, 64, 175, 0.1);
    }

    .sotto {
      color: #475569;
      font-size: 1.15rem;
      font-style: italic;
      font-weight: 500;
    }

    /* CONTENITORE PRINCIPALE (SCHEDA) */
    .scheda {
      background-color: #ffffff;
      max-width: 650px;
      margin: 0 auto;
      padding: 35px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(30, 58, 138, 0.12);
      border: 1px solid #cbd5e1;
    }

    /* TITOLI DI SEZIONE COLORATI */
    h2 {
      color: #2563eb; /* BLU BRILLANTE */
      font-size: 1.35rem;
      margin-top: 28px;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 3px solid #dbeafe;
    }

    .scheda section:first-of-type h2 {
      margin-top: 0;
    }

    p {
      color: #334155;
      margin-bottom: 12px;
      font-size: 1rem;
    }

    /* LISTE COLORATE */
    ul, ol {
      margin-left: 22px;
      color: #334155;
      margin-bottom: 15px;
    }

    li {
      margin-bottom: 6px;
    }

    /* BARRE DI PROGRESSO COLORATE */
    .skill-box {
      margin-bottom: 12px;
    }

    .skill-box label {
      font-weight: 600;
      color: #1e293b;
      display: block;
      margin-bottom: 4px;
    }

    progress {
      width: 100%;
      height: 12px;
      border-radius: 10px;
      overflow: hidden;
      appearance: none;
    }

    progress::-webkit-progress-bar {
      background-color: #e2e8f0;
      border-radius: 10px;
    }

    progress::-webkit-progress-value {
      background: linear-gradient(90deg, #3b82f6, #1d4ed8);
      border-radius: 10px;
    }

    /* TENDINA ESPANDIBILE COLORATA */
    details {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 16px;
      margin-top: 10px;
      transition: all 0.2s ease;
    }

    details[open] {
      background-color: #eff6ff;
      border-color: #bfdbfe;
    }

    summary {
      cursor: pointer;
      font-weight: 600;
      color: #1d4ed8;
    }

    details p {
      margin-top: 10px;
      margin-bottom: 0;
      color: #1e3a8a;
    }

    /* TABELLA STILIZZATA E COLORATA */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    th {
      background-color: #1e40af;
      color: #ffffff;
      padding: 12px;
      text-align: left;
      font-size: 0.95rem;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
      background-color: #ffffff;
      color: #334155;
    }
