<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Il mio primo sito - Filippo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      text-align: center;
      margin: 20px;
    }

    h1 {
      color: #2c3e50;
    }

    .sotto {
      color: #666;
      font-style: italic;
    }

    .scheda {
      background-color: #ffffff;
      border: 1px solid #ddd;
      border-radius: 10px;
      max-width: 450px;
      margin: 20px auto;
      padding: 20px;
      text-align: left;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .scheda h2 {
      color: #2980b9;
      border-bottom: 1px solid #eee;
      padding-bottom: 5px;
    }

    ul {
      line-height: 1.6;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 10px 0;
    }

    .piede {
      margin-top: 30px;
      font-size: 0.85em;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>Ciao, sono Filippo</h1>
  <p class="sotto">Questo è il mio primo sito web.</p>

  <div class="scheda">
    <h2>Chi sono</h2>
    <p>Studio informatica e mi piace creare cose nuove.</p>

    <h2>Le mie passioni</h2>
    <ul>
      <li>Calcio</li>
      <li>Basket</li>
      <li>Musica</li>
    </ul>

    <!-- Foto presente nella cartella img -->
    <img src="img/passione.jpg" alt="Le mie passioni" width="300">

    <h2>Il mio sogno</h2>
    <p>Lavorare con i computer.</p>
  </div>

  <p class="piede">Sito creato da me - 2026</p>

</body>
</html>
